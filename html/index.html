<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LXR Lockpick</title>
    <link rel="stylesheet" href="lxr-ui.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="lxr">
    <div class="lxr-center lxr-hit lxr-panel lxr-p6 lxr-hidden" id="panel" style="width: 420px;">
        <!-- Brand mark -->
        <div class="lxr-between lxr-g4 lxr-p4 lxr-rule-b">
            <div class="lp-logo-wrap">
                <img class="lp-logo" src="img/lxrcore-logo.png" alt="" />
            </div>
            <div class="lxr-grow lxr-stack lxr-g1">
                <span class="lxr-mono" id="brand-label"></span>
            </div>
        </div>

        <!-- Title -->
        <h2 class="lxr-cut lxr-title lxr-p4" id="title"></h2>

        <!-- Hint -->
        <p class="lxr-ka lxr-t-ash lxr-text-sm lxr-p4 lxr-rule-b" id="hint"></p>

        <!-- Pin rows container -->
        <div class="lxr-stack lxr-g3" id="pins"></div>

        <!-- Status footer -->
        <div class="lxr-between lxr-g4 lxr-p4">
            <span class="lxr-mono lxr-t-smoke" id="status"></span>
            <span class="lxr-mono lxr-t-ash" id="tries"></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
